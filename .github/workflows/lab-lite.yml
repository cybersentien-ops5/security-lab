name: lab-lite

on:
  push:
    branches: [main]
    paths:
      - "lab/**"
      - "demo/**"
      - "scripts/**"
      - ".github/workflows/lab-lite.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lab-lite
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OUT_DIR: ${{ github.workspace }}/out
      ALERT_WAIT: "240"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af >/dev/null || true
          mkdir -p "$OUT_DIR/logs"
          df -h / | tail -1 | tee "$OUT_DIR/logs/disk.txt"

      - name: Kernel setting for the Wazuh indexer
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Generate certificates (Wazuh's own generator)
        run: |
          . demo/lib.sh
          lab_certs
          sudo chmod -R a+r lab/wazuh/certs
          ls lab/wazuh/certs | tee "$OUT_DIR/logs/certs.txt"

      - name: Start the lab
        run: |
          docker compose -f lab/compose.yml pull -q
          docker compose -f lab/compose.yml up -d
          docker compose -f lab/compose.yml ps

      - name: Wait for health
        id: health
        continue-on-error: true
        run: |
          . demo/lib.sh
          lab_wait 900 2>&1 | tail -n 40 | tee "$OUT_DIR/logs/wait.txt"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Run the attacks
        id: attack
        continue-on-error: true
        run: bash demo/attack.sh 2>&1 | tee "$OUT_DIR/logs/attack.txt"

      - name: Check the lab
        id: check
        continue-on-error: true
        run: |
          bash demo/check.sh 2>&1 | tee "$OUT_DIR/logs/check.txt"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Screenshots (Playwright)
        id: shots
        continue-on-error: true
        run: |
          pip install -q playwright==1.48.0
          python -m playwright install --with-deps chromium >/dev/null
          python scripts/screenshots.py "$OUT_DIR" 2>&1 | tail -n 20 | tee "$OUT_DIR/logs/screenshots.txt"

      - name: Collect log tails
        if: always()
        run: |
          mkdir -p "$OUT_DIR/logs"
          docker ps -a --filter label=com.docker.compose.project=seclab --format '{{.ID}} {{.Label "com.docker.compose.service"}}' > "$OUT_DIR/containers.txt" || true
          docker compose -f lab/compose.yml ps -a > "$OUT_DIR/logs/ps.txt" 2>&1 || true
          for s in juiceshop waf suricata wazuh.manager wazuh.indexer wazuh.dashboard; do
            docker compose -f lab/compose.yml logs --no-color --tail 60 "$s" > "$OUT_DIR/logs/$s.tail.txt" 2>&1 || true
          done
          docker compose -f lab/compose.yml exec -T waf sh -c 'tail -n 40 /var/log/lab/waf/modsec_audit.json' > "$OUT_DIR/logs/waf_modsec_audit.tail.txt" 2>&1 || true
          docker compose -f lab/compose.yml exec -T wazuh.manager sh -c 'grep -c . /var/log/lab/suricata/eve.json; grep "\"event_type\":\"alert\"" /var/log/lab/suricata/eve.json | tail -n 5' > "$OUT_DIR/logs/suricata_eve_alerts.tail.txt" 2>&1 || true
          docker compose -f lab/compose.yml exec -T wazuh.manager sh -c 'tail -n 30 /var/ossec/logs/ossec.log' > "$OUT_DIR/logs/wazuh_ossec.tail.txt" 2>&1 || true
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' > "$OUT_DIR/logs/memory.txt" 2>&1 || true

      - name: Scorecard and CyberSentien export
        if: always()
        run: |
          python3 scripts/scorecard.py "$OUT_DIR" "${{ github.run_id }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "health=${{ steps.health.outcome }} attack=${{ steps.attack.outcome }} check=${{ steps.check.outcome }} screenshots=${{ steps.shots.outcome }}"
            echo "commit=${{ github.sha }}"
          } > "$OUT_DIR/steps.txt"

      - name: Commit results to the results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          RID="${{ github.run_id }}"
          W=$(mktemp -d); cd "$W"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin results; then git checkout -q -b results FETCH_HEAD; else git checkout -q --orphan results; fi
          mkdir -p "results/$RID"
          cp -r "$OUT_DIR"/. "results/$RID/"
          git add results
          git commit -q -m "results: run $RID [skip ci]"
          for i in 1 2 3 4; do
            if git push -q origin HEAD:results; then echo "pushed results/$RID"; exit 0; fi
            sleep $((i*3)); git fetch -q --depth 1 origin results && git rebase -q FETCH_HEAD || true
          done
          exit 1

      - name: Verdict
        if: always()
        run: |
          echo "health=${{ steps.health.outcome }} check=${{ steps.check.outcome }}"
          test "${{ steps.check.outcome }}" = "success"

      - name: Stop the lab
        if: always()
        run: docker compose -f lab/compose.yml down -v --remove-orphans || true
