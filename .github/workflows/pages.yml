name: pages

# Publishes the public web page (GitHub Pages, branch gh-pages) from the newest green run's proof.
on:
  push:
    branches: [main]
    paths:
      - "docs/proof/**"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build the page
        run: python3 scripts/build_site.py site
      - name: Push to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish page from ${{ github.sha }} [skip ci]"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
