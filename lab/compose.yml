# Security lab (lite) - one compose file used by GitHub Actions and the laptop.
# Every image is pinned. All data is synthetic. Ports bind to 127.0.0.1 only.
#
# Zones (ready for the full build's nftables firewall between them):
#   dmz  - the web application firewall (+ Suricata in its network namespace)
#   app  - OWASP Juice Shop, reachable only through the WAF
#   siem - Wazuh manager, indexer and dashboard
#
# Memory budget (limits): indexer 2g, manager 1.2g, dashboard 1g, juice shop 512m,
# waf 256m, suricata 512m, init 32m  = about 5.5 GB.

name: seclab

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "2" }

services:

  # ---------- one-off setup (profile "setup"): Wazuh's own certificate generator ----------
  certs:
    image: wazuh/wazuh-certs-generator:0.0.2
    profiles: ["setup"]
    hostname: wazuh-certs-generator
    volumes:
      - ./wazuh/certs/:/certificates/
      - ./wazuh/config/certs.yml:/config/certs.yml:ro

  # ---------- prepares the shared log folders so every container can write/read them ----------
  log-init:
    image: busybox:1.36.1
    command: ["sh", "-c", "mkdir -p /logs/waf /logs/suricata && touch /logs/waf/modsec_audit.json && chmod -R 0777 /logs"]
    volumes:
      - waf-logs:/logs/waf
      - suricata-logs:/logs/suricata
    mem_limit: 32m
    logging: *logging

  # ---------- APP zone: the deliberately vulnerable target ----------
  juiceshop:
    image: bkimminich/juice-shop:v17.1.1
    networks: [app]
    mem_limit: 512m
    labels: { lab.zone: app, lab.role: target }
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "require('http').get('http://127.0.0.1:3000/rest/admin/application-version',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *logging

  # ---------- DMZ zone: web application firewall (OWASP Core Rule Set, blocking mode) ----------
  waf:
    image: owasp/modsecurity-crs:4.25.2-nginx-202610180210-lts
    networks: [dmz, app]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      BACKEND: http://juiceshop:3000
      PORT: "8080"
      SERVER_NAME: localhost
      MODSEC_RULE_ENGINE: "On"          # blocking mode
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG: /var/log/lab/waf/modsec_audit.json
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_TYPE: Serial
    volumes:
      - waf-logs:/var/log/lab/waf
    depends_on:
      log-init: { condition: service_completed_successfully }
      juiceshop: { condition: service_healthy }
    mem_limit: 256m
    labels: { lab.zone: dmz, lab.role: waf }
    logging: *logging

  # ---------- intrusion detection: Suricata inside the WAF's network namespace ----------
  # network_mode service:waf means Suricata sniffs the WAF's own eth0, so it behaves the
  # same on Linux (GitHub runner) and macOS (Docker Desktop VM).
  suricata:
    image: jasonish/suricata:7.0.17
    network_mode: "service:waf"
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    command: ["--pcap=eth0", "-k", "none", "-S", "/lab/rules/lab.rules"]
    volumes:
      - ./suricata/lab.rules:/lab/rules/lab.rules:ro
      - suricata-logs:/var/log/suricata
    depends_on:
      log-init: { condition: service_completed_successfully }
      waf: { condition: service_started }
    mem_limit: 512m
    labels: { lab.zone: dmz, lab.role: ids }
    logging: *logging

  # ---------- SIEM zone: Wazuh single node (official wazuh-docker single-node layout) ----------
  wazuh.manager:
    image: wazuh/wazuh-manager:4.9.2
    hostname: wazuh.manager
    networks: [siem]
    ports:
      - "127.0.0.1:55000:55000"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./wazuh/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./wazuh/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./wazuh/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      - ./wazuh/config/lab_rules.xml:/wazuh-config-mount/etc/rules/local_rules.xml
      # lab log shipping: the manager reads the WAF and Suricata logs (read-only)
      - waf-logs:/var/log/lab/waf:ro
      - suricata-logs:/var/log/lab/suricata:ro
    depends_on:
      log-init: { condition: service_completed_successfully }
    mem_limit: 1200m
    labels: { lab.zone: siem, lab.role: siem-manager }
    logging: *logging

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.9.2
    hostname: wazuh.indexer
    networks: [siem]
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh/certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ./wazuh/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key
      - ./wazuh/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      - ./wazuh/certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ./wazuh/certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      - ./wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ./wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml
    mem_limit: 2g
    labels: { lab.zone: siem, lab.role: siem-indexer }
    logging: *logging

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.9.2
    hostname: wazuh.dashboard
    networks: [siem]
    ports:
      - "127.0.0.1:8443:5601"
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - ./wazuh/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./wazuh/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./wazuh/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./wazuh/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    mem_limit: 1g
    labels: { lab.zone: siem, lab.role: siem-dashboard }
    logging: *logging

networks:
  dmz:
  app:
  siem:

volumes:
  waf-logs:
  suricata-logs:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
